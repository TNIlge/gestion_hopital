services:
  # 1. Base de données PostgreSQL avec pgvector
  postgres-db:
    image: ankane/pgvector:latest
    container_name: hospital_db
    environment:
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_password
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Outil de visualisation web pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: hospital_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eilco.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    restart: unless-stopped

  # 3. Application Backend (Spring Boot Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-mon-org}/gestion_hopital-backend:latest
    container_name: hospital_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hospital_db
      SPRING_DATASOURCE_USERNAME: hospital_user
      SPRING_DATASOURCE_PASSWORD: hospital_password
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    restart: unless-stopped

  # 4. Application Frontend (Angular 19 + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-mon-org}/gestion_hopital-frontend:latest
    container_name: hospital_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
